[project]
name = "ivm-vs-bespoke"
version = "0.0.0"
description = "Compare PostgreSQL pg_ivm with SynnoDB (BespokeOLAP)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "synnodb[notebook,factory]",
    # SynnoDB's lock and drop-in import target DuckDB 1.x. 2.0 exposes names
    # that dir() lists but getattr() cannot read.
    "duckdb==1.5.3",
    "jupyter",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.uv.sources]
synnodb = { path = "SynnoDB", editable = true }
